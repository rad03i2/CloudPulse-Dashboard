<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CloudPulse Dashboard</title><style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;background:#08111f;color:#eaf2ff}body{margin:0;max-width:1100px;padding:32px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px}.muted{color:#9fb0c8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin:24px 0}.card{background:#101d30;border:1px solid #243651;border-radius:16px;padding:18px}.status{font-weight:700}.HEALTHY{color:#73e2a7}.DEGRADED{color:#ffd166}.CRITICAL{color:#ff7b7b}table{width:100%;border-collapse:collapse;background:#101d30;border-radius:16px;overflow:hidden}th,td{text-align:left;padding:12px;border-bottom:1px solid #243651}button{padding:10px 14px;border:0;border-radius:10px;cursor:pointer}@media(max-width:650px){body{padding:18px}table{font-size:13px}th:nth-child(4),td:nth-child(4){display:none}}</style></head><body><header><div><h1>CloudPulse</h1><div class="muted">Self-hosted service telemetry dashboard</div></div><button id="refresh">Refresh</button></header><section class="grid" id="summary"></section><h2>Services</h2><table><thead><tr><th>Service</th><th>Status</th><th>p99</th><th>RPS</th><th>Errors</th></tr></thead><tbody id="services"></tbody></table><h2>Recent alerts</h2><div id="alerts" class="grid"></div><p class="muted" id="updated"></p><script>const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const r=await fetch('/api/telemetry',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();summary.innerHTML=['total','healthy','degraded','critical'].map(k=>`<div class="card"><div class="muted">${k}</div><h2>${d.summary[k]}</h2></div>`).join('');services.innerHTML=d.services.length?d.services.map(s=>`<tr><td>${esc(s.serviceName)}</td><td class="status ${s.status}">${s.status}</td><td>${s.latencyP99Ms} ms</td><td>${s.requestsPerSecond}</td><td>${s.errorRatePercent}%</td></tr>`).join(''):'<tr><td colspan="5">No telemetry yet. POST a sample to /api/telemetry.</td></tr>';alerts.innerHTML=d.recentAlerts.length?d.recentAlerts.map(a=>`<div class="card"><strong class="${a.severity==='critical'?'CRITICAL':'DEGRADED'}">${esc(a.serviceName)}</strong><p>${esc(a.message)}</p></div>`).join(''):'<div class="card muted">No active alerts.</div>';updated.textContent='Updated '+new Date(d.timestamp).toLocaleString()}catch(e){updated.textContent='Unable to load telemetry: '+e.message}}refresh.onclick=load;load();setInterval(load,10000)</script></body></html>
